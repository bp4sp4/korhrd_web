<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTACT 그래픽 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>.tag { padding: 40px var(--pad) 16px; font-size: 18px; font-weight: 800; color: var(--navy); max-width: var(--wrap); margin: 0 auto; }</style>
</head>
<body>
<p class="tag">A · 연결 (겹친 두 패널)</p>
<section class="contact" style="--contact-art: url(img/art/contact-a-connect.svg)">
  <div class="contact-art" aria-hidden="true"></div>
  <div class="inner">
    <div class="contact-big">함께 성장할<br>파트너를 기다립니다<span class="dot">.</span></div>
    <div class="contact-row">
      <p>배움과 일을 잇는 새로운 제안,<br>한평생에 남겨주세요.</p>
      <div class="contact-btns"><button class="pill white">비즈니스 제안 <span class="arr">→</span></button></div>
    </div>
  </div>
</section>
<p class="tag">B · 만남 (교차하는 리본)</p>

    </div>
  </div>
</section>

  <div class="contact-art" aria-hidden="true"></div>

      <p>배움과 일을 잇는 새로운 제안,<br>한평생에 남겨주세요.</p>

      <p>배움과 일을 잇는 새로운 제안,<br>한평생에 남겨주세요.</p>
      <div class="contact-btns"><button class="pill white">비즈니스 제안 <span class="arr">→</span></button></div>
    </div>
  </div>
</section>
</body>
</html>
