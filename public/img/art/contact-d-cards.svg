<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700"><defs><style>
  .card{animation:card 3.4s ease-in-out infinite alternate}
  .c1{animation-delay:-2.6s}.c2{animation-delay:-1.3s}.c3{animation-delay:0s}
  .flow{animation:flow 1.6s linear infinite}
  .bob{transform-box:fill-box;animation:bob ease-in-out infinite alternate}
  .b1{animation-duration:2.8s;animation-delay:-1s}.b2{animation-duration:3.4s;animation-delay:-2s}
  @keyframes card{from{transform:translateY(12px)}to{transform:translateY(-16px)}}
  @keyframes flow{to{stroke-dashoffset:-22.2}}
  @keyframes bob{from{transform:translateY(-9px)}to{transform:translateY(9px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<linearGradient id="w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#D6E3FD"/></linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#CFDDFF" stop-opacity=".22"/></linearGradient>
<linearGradient id="wb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#C9DAFF"/></linearGradient>
<radialGradient id="sb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#B3CDFF"/><stop offset=".65" stop-color="#4C85FF"/><stop offset="1" stop-color="#2F64DE"/></radialGradient>
<radialGradient id="sn" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#C9DAFF"/><stop offset=".25" stop-color="#4C6FB8"/><stop offset=".7" stop-color="#00376E"/><stop offset="1" stop-color="#001E40"/></radialGradient>
<radialGradient id="sg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#E4ECFF" stop-opacity=".8"/><stop offset="1" stop-color="#B9CEFF" stop-opacity=".8"/></radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0036A0" flood-opacity=".22"/></filter>
</defs><g filter="url(#sh)"><g class="card c1"><rect x="250" y="120" width="380" height="250" rx="48" fill="url(#w2)" stroke="#fff" stroke-opacity=".55" stroke-width="2" transform="rotate(-8 440 245)"/></g><g class="card c2"><rect x="210" y="230" width="400" height="260" rx="50" fill="url(#w2)" stroke="#fff" stroke-opacity=".7" stroke-width="2" transform="rotate(-3 410 360)"/></g><g class="card c3"><rect x="180" y="340" width="420" height="270" rx="52" fill="url(#w1)"/></g></g><g class="card c3"><rect x="240" y="420" width="160" height="18" rx="9" fill="#C9DAFF"/><rect x="240" y="460" width="240" height="18" rx="9" fill="#E1EAFE"/><circle cx="560" cy="360" r="34" fill="url(#sb)"/></g><path d="M600,330 Q720,250 760,140" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 11" class="flow"/><circle class="bob b1" cx="760" cy="140" r="14" fill="url(#sg)"/><circle class="bob b2" cx="130" cy="230" r="20" fill="url(#sn)"/></svg>