<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900"><defs><style>
  .glow{transform-origin:450px 470px;animation:glow 3.5s ease-in-out infinite alternate}
  .flow{animation:flow 1.6s linear infinite}
  .orb{transform-box:fill-box;transform-origin:center;animation:bob ease-in-out infinite alternate}
  .o1{animation-duration:2.6s}.o2{animation-duration:3.2s;animation-delay:-1s}.o3{animation-duration:2.9s;animation-delay:-2s}.o4{animation-duration:3.6s;animation-delay:-.5s}.o5{animation-duration:3s;animation-delay:-1.5s}
  @keyframes glow{from{transform:scale(.95);opacity:.8}to{transform:scale(1.03);opacity:1}}
  @keyframes flow{to{stroke-dashoffset:-22.2}}
  @keyframes bob{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
  .leaves{transform-origin:450px 700px;animation:sway 3.2s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5B92FF" stop-opacity=".2"/><stop offset=".6" stop-color="#5B92FF" stop-opacity=".06"/><stop offset="1" stop-color="#5B92FF" stop-opacity="0"/></radialGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6EEFD"/><stop offset="1" stop-color="#B4C9F4"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9D8F5"/><stop offset="1" stop-color="#7EA2F0"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3C1FF"/><stop offset="1" stop-color="#4C85FF"/></linearGradient>
<linearGradient id="gn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C6FB8"/><stop offset="1" stop-color="#00376E"/></linearGradient>
<radialGradient id="sb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".18" stop-color="#9CC0FF"/><stop offset=".6" stop-color="#4C85FF"/><stop offset="1" stop-color="#2F64DE"/></radialGradient>
<radialGradient id="sn" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#C9DAFF"/><stop offset=".25" stop-color="#4C6FB8"/><stop offset=".7" stop-color="#00376E"/><stop offset="1" stop-color="#001E40"/></radialGradient>
<radialGradient id="sg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#DDE8FF" stop-opacity=".6"/><stop offset="1" stop-color="#9CC0FF" stop-opacity=".7"/></radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3D6FD6" flood-opacity=".16"/></filter>
</defs><ellipse class="glow" cx="450" cy="470" rx="440" ry="420" fill="url(#glow)"/><path d="M140,250 Q300,120 470,170" fill="none" stroke="#8FA9EA" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 11" class="flow"/><g class="leaves"><path d="M450,660 C420,500 300,410 140,410 C160,580 300,670 450,660 Z" fill="url(#g1)"/><g filter="url(#sh)"><path d="M450,660 C470,460 600,330 790,300 C780,510 640,660 450,660 Z" fill="url(#g2)" opacity=".85"/><path d="M450,660 C465,560 530,490 620,470 C605,570 540,640 450,660 Z" fill="url(#g3)" opacity=".85"/></g></g><path d="M450,660 Q458,730 450,790" fill="none" stroke="url(#gn)" stroke-width="7" stroke-linecap="round"/><path d="M130,790 Q240,760 350,790 T570,790 T790,790" fill="none" stroke="#9DB6EE" stroke-width="2" stroke-linecap="round"/><path d="M180,835 Q290,805 400,835 T620,835 T760,830" fill="none" stroke="#8FA9EA" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 11" class="flow"/><circle class="orb o1" cx="470" cy="170" r="30" fill="url(#sb)"/><circle class="orb o2" cx="740" cy="640" r="18" fill="url(#sn)"/><circle class="orb o3" cx="220" cy="560" r="14" fill="url(#sg)"/><circle class="orb o4" cx="150" cy="250" r="12" fill="url(#sg)"/></svg>