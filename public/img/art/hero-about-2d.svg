<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900"><defs><style>
  .glow{transform-origin:450px 470px;animation:glow 3.5s ease-in-out infinite alternate}
  .flow{animation:flow 1.6s linear infinite}
  .orb{transform-box:fill-box;transform-origin:center;animation:bob ease-in-out infinite alternate}
  .o1{animation-duration:2.6s}.o2{animation-duration:3.2s;animation-delay:-1s}.o3{animation-duration:2.9s;animation-delay:-2s}.o4{animation-duration:3.6s;animation-delay:-.5s}.o5{animation-duration:3s;animation-delay:-1.5s}
  @keyframes glow{from{transform:scale(.95);opacity:.8}to{transform:scale(1.03);opacity:1}}
  @keyframes flow{to{stroke-dashoffset:-22.2}}
  @keyframes bob{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
  .shapes{animation:rise 3.4s ease-in-out infinite alternate}
  @keyframes rise{from{transform:translateY(6px)}to{transform:translateY(-8px)}}
  .o1{animation:w1 5.2s ease-in-out infinite -1.2s}
  .o2{animation:w2 6.4s ease-in-out infinite -3.1s}
  .o3{animation:w3 4.6s ease-in-out infinite -.4s}
  .o4{animation:w4 5.8s ease-in-out infinite -2.3s}
  @keyframes w1{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}62%{transform:translateY(-4px)}}
  @keyframes w2{0%,100%{transform:translateY(0)}25%{transform:translateY(12px)}55%{transform:translateY(20px)}82%{transform:translateY(-7px)}}
  @keyframes w3{0%,100%{transform:translateY(0)}38%{transform:translateY(-12px)}70%{transform:translateY(10px)}}
  @keyframes w4{0%,100%{transform:translateY(0)}35%{transform:translateY(15px)}66%{transform:translateY(-13px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5B92FF" stop-opacity=".2"/><stop offset=".6" stop-color="#5B92FF" stop-opacity=".06"/><stop offset="1" stop-color="#5B92FF" stop-opacity="0"/></radialGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6EEFD"/><stop offset="1" stop-color="#B4C9F4"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9D8F5"/><stop offset="1" stop-color="#7EA2F0"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3C1FF"/><stop offset="1" stop-color="#4C85FF"/></linearGradient>
<linearGradient id="gn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C6FB8"/><stop offset="1" stop-color="#00376E"/></linearGradient>
