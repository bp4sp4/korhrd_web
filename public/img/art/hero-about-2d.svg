<radialGradient id="sn" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#C9DAFF"/><stop offset=".25" stop-color="#4C6FB8"/><stop offset=".7" stop-color="#00376E"/><stop offset="1" stop-color="#001E40"/></radialGradient>
<radialGradient id="sg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#DDE8FF" stop-opacity=".6"/><stop offset="1" stop-color="#9CC0FF" stop-opacity=".7"/></radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3D6FD6" flood-opacity=".16"/></filter>
</defs><ellipse class="glow" cx="450" cy="470" rx="440" ry="420" fill="url(#glow)"/><path d="M190.0,780 V340.0 A280.0,280.0 0 0 1 750.0,340.0 V780" fill="none" stroke="#9DB6EE" stroke-width="2" stroke-linecap="round"/><path d="M150.0,780 V300.0 A320.0,320.0 0 0 1 790.0,300.0 V780" fill="none" stroke="#8FA9EA" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 11" class="flow"/><g class="shapes" filter="url(#sh)"><path d="M290.0,780 V390.0 A210.0,210.0 0 0 1 710.0,390.0 V780 Z" fill="url(#g1)"/><path d="M250.0,780 V490.0 A150.0,150.0 0 0 1 550.0,490.0 V780 Z" fill="url(#g2)" opacity=".8"/><path d="M460.0,780 V590.0 A100.0,100.0 0 0 1 660.0,590.0 V780 Z" fill="url(#g3)" opacity=".85"/></g><line x1="150" y1="780" x2="760" y2="780" fill="none" stroke="#9DB6EE" stroke-width="2" stroke-linecap="round"/><circle class="orb o1" cx="560" cy="438" r="34" fill="url(#sb)"/><circle class="orb o2" cx="708" cy="250" r="18" fill="url(#sn)"/><circle class="orb o3" cx="232" cy="300" r="22" fill="url(#sg)"/><circle class="orb o4" cx="770" cy="610" r="10" fill="url(#sb)"/></svg>